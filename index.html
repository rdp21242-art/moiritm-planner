<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мой ритм">

<title>Мой ритм — планер</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0b10;
  --panel:#12141c;
  --panel2:#1a1d28;
  --line:#2a2f42;
  --text:#f5f7ff;
  --muted:#8b93a8;
  --accent:#d4ff00;
  --accentText:#0d1400;
  --blue:#00e5ff;
  --radius:20px;
  --neon-pink:#ff2d95;
  --neon-orange:#ff6b00;
  --neon-cyan:#00f0ff;
  --neon-violet:#b44dff;
  --neon-lime:#d4ff00;
  --neon-green:#39ff14;
  --neon-coral:#ff5e7a;
  --neon-yellow:#ffe600;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}
.wrap{max-width:680px;margin:auto;padding:18px 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 18px}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.brand{font-size:24px;font-weight:750;letter-spacing:-.04em}
.date{font-size:13px;color:var(--muted);text-align:right}
.hero{background:linear-gradient(145deg,#14182a 0%,#0e1018 50%,#1a1030 100%);border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:0 0 40px rgba(180,77,255,.08),0 8px 28px rgba(0,0,0,.35)}
.hero h1{font-size:26px;line-height:1.15;letter-spacing:-.04em;margin:6px 0 6px}
.hero p{color:var(--muted);margin:0 0 14px;font-size:14px}
.hero-row{display:flex;align-items:center;gap:12px}
.progress{height:8px;background:#1e2436;border-radius:10px;overflow:hidden;flex:1;box-shadow:inset 0 0 8px rgba(0,0,0,.4)}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#d4ff00,#39ff14,#00f0ff);border-radius:10px;transition:width .25s ease;box-shadow:0 0 12px rgba(212,255,0,.5)}
.progress-label{font-size:12px;color:var(--muted);white-space:nowrap}

.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.counter-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;position:relative;overflow:hidden}
.counter-card:before{content:"";position:absolute;inset:0;opacity:.15;background:linear-gradient(135deg,var(--c1),var(--c2));pointer-events:none}
.counter-card.week{--c1:#00e5ff;--c2:#b44dff}
.counter-card.chores{--c1:#d4ff00;--c2:#39ff14}
.counter-card .c-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.counter-card .c-value{font-size:22px;font-weight:750;letter-spacing:-.03em}
.counter-card .c-bar{height:5px;background:#1e2436;border-radius:6px;margin-top:8px;overflow:hidden}
.counter-card .c-bar span{display:block;height:100%;border-radius:6px;transition:width .25s}
.counter-card.week .c-bar span{background:linear-gradient(90deg,#00e5ff,#b44dff);box-shadow:0 0 8px rgba(0,229,255,.5)}
.counter-card.chores .c-bar span{background:linear-gradient(90deg,#d4ff00,#39ff14);box-shadow:0 0 8px rgba(212,255,0,.5)}

.tabs{display:flex;gap:7px;background:#0e1018;border:1px solid var(--line);padding:5px;border-radius:15px;margin-bottom:18px}
.tab{flex:1;padding:11px 4px;border-radius:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:650}
.tab.active{background:#1e2436;color:var(--text);box-shadow:0 0 12px rgba(212,255,0,.12)}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 11px}
.section-head h2{font-size:19px;margin:0;letter-spacing:-.03em}
.sub{font-size:12px;color:var(--muted)}
.day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 16px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 2px 9px;text-align:center;min-width:0;transition:transform .12s,box-shadow .12s}
.day .dow{font-size:10px;color:var(--muted);text-transform:uppercase}
.day .num{font-size:17px;font-weight:700;margin-top:3px}
.day.selected{background:var(--accent);color:var(--accentText);border-color:var(--accent);transform:scale(1.05);box-shadow:0 0 18px rgba(212,255,0,.45)}
.day.selected .dow{color:#3d4a00}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:10px}
.card.task-tile{border:0;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:grab;touch-action:none;user-select:none}
.card.task-tile:active{cursor:grabbing}
.card.task-tile.dragging{opacity:.55;transform:scale(1.02);box-shadow:0 0 24px rgba(212,255,0,.3);z-index:5}
.card.task-tile.drag-over{outline:2px solid var(--neon-cyan);outline-offset:2px}
.card.task-tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tile);box-shadow:0 0 12px var(--tile)}
.card.task-tile.cat-home{background:linear-gradient(135deg,#0f2a22,#0c1e1a);--tile:#39ff14}
.card.task-tile.cat-hobby{background:linear-gradient(135deg,#22153a,#1a1030);--tile:#b44dff}
.card.task-tile.cat-sport{background:linear-gradient(135deg,#2e1c0c,#24160a);--tile:#ff6b00}
.card.task-tile.cat-family{background:linear-gradient(135deg,#2a1020,#1e0c18);--tile:#ff2d95}
.card.task-tile.cat-rest{background:linear-gradient(135deg,#0c1e30,#0a1826);--tile:#00e5ff}
.card.task-tile.cat-work{background:linear-gradient(135deg,#1a1e28,#141820);--tile:#8b93a8}
.card.task-tile[data-hue="0"]{--tile:#39ff14}.card.task-tile[data-hue="1"]{--tile:#b44dff}
.card.task-tile[data-hue="2"]{--tile:#ff6b00}.card.task-tile[data-hue="3"]{--tile:#ff2d95}
.card.task-tile[data-hue="4"]{--tile:#00e5ff}.card.task-tile[data-hue="5"]{--tile:#00f0ff}
.card.task-tile[data-hue="6"]{--tile:#ff5e7a}.card.task-tile[data-hue="7"]{--tile:#d4ff00}

.task-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.drag-handle{font-size:16px;color:var(--muted);padding:4px 2px;opacity:.6}
.add-task-btn{width:100%;padding:14px;border:1px dashed #4a5568;background:#12141c;color:var(--text);border-radius:15px;font-weight:700;margin:8px 0 12px}
.modal-backdrop{position:fixed;inset:0;background:#000c;display:grid;place-items:end center;padding:14px;z-index:30}
.modal{width:100%;max-width:560px;background:#161922;border:1px solid var(--line);border-radius:22px;padding:20px;max-height:90vh;overflow:auto;box-shadow:0 0 40px rgba(180,77,255,.15)}
.modal h2{margin:0 0 15px;font-size:20px}
.field{display:grid;gap:6px;margin:11px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:#0e1018;border:1px solid #2e3548;color:var(--text);padding:12px;border-radius:11px}
.field textarea{min-height:70px;resize:vertical}
.chore-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chore-chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#12141c;font-size:13px;color:var(--muted);transition:all .15s}
.chore-chip.selected{background:rgba(212,255,0,.15);border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px rgba(212,255,0,.25)}
.task{display:flex;gap:12px;align-items:flex-start}
.check{width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:2px solid #4a5568;background:transparent;display:grid;place-items:center;margin-top:1px;transition:all .15s}
.check.done{background:var(--accent);border-color:var(--accent);color:var(--accentText);box-shadow:0 0 16px rgba(212,255,0,.5)}
.check.done:after{content:"✓";font-weight:900;font-size:14px}
.task-main{flex:1;min-width:0}
.task-title{font-weight:650;font-size:15px}
.task-title.done{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px;margin-top:4px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.07);border-radius:7px;padding:4px 8px;font-weight:600}
.time{font-size:12px;color:var(--blue);font-weight:700;white-space:nowrap;text-shadow:0 0 8px rgba(0,229,255,.4)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:18px}
.week-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.week-row:last-child{border-bottom:0}
.week-day{width:78px;flex-shrink:0;font-size:13px;font-weight:700}
.week-info{flex:1;min-width:0}
.week-info strong{display:block;font-size:14px}
.week-info span{font-size:12px;color:var(--muted)}
.mini-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 10px rgba(212,255,0,.7)}
.list-item{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item input{accent-color:var(--accent);width:19px;height:19px}
.list-item label{flex:1;font-size:14px}
.list-item small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat .big{font-size:25px;font-weight:750;letter-spacing:-.04em}
.stat .label{font-size:12px;color:var(--muted);margin-top:3px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(10,11,16,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav-inner{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.nav-btn{background:transparent;color:var(--muted);border-radius:12px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}
.nav-btn .ico{font-size:19px}
.nav-btn.active{color:var(--accent);background:#1a2208;text-shadow:0 0 10px rgba(212,255,0,.4)}
.edit-task{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:6px 8px;font-size:12px;white-space:nowrap}
.action{background:var(--accent);color:var(--accentText);font-weight:750;border-radius:12px;padding:12px 15px;box-shadow:0 0 16px rgba(212,255,0,.35)}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px}
.hidden{display:none!important}
.footer{color:#4a5268;text-align:center;font-size:11px;padding:18px 0}
.sync-status{font-size:11px;color:var(--muted);text-align:right;margin-top:4px;min-height:16px}
.sync-status.ok{color:#39ff14}.sync-status.err{color:#ff5e7a}.sync-status.busy{color:var(--blue)}
.sync-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.sync-box .field{margin:8px 0}
.chore-lines{margin-top:4px;font-size:13px;color:var(--neon-green);line-height:1.45}
@media(min-width:600px){.wrap{padding:28px 24px}.hero h1{font-size:32px}.day-strip{gap:9px}.day{padding:13px 4px}.card{padding:18px}}
</style>
</head>
<body>

</div></nav>
<script>

1:{title:'Бассейн и день для семьи',text:'До 18:00 — семья и совместные планы. Никаких обязательных проектов.',tasks:[

  if(savedSchedule){Object.keys(schedule).forEach(k=>{if(savedSchedule[k]&&Array.isArray(savedSchedule[k].tasks))schedule[k]=savedSchedule[k]})}
}catch(e){}

      tasks.splice(insertAt,0,['17:15','Домашние дела','home','Одно или несколько дел из списка']);
    }
  }
})();

{title:'Баланс',items:[['Провёл время с женой и семьёй','Понедельник до 18:00 — семейное время'],['Оставил время для отдыха','Не нужно заполнять каждое окно'],['Не жертвовал сном','Ориентир — лечь около 23:00']]}
];
let page='today',filter='all',selectedDay=new Date().getDay();
const storeKey='moiritm_planner_v1';
const pwdKey='moiritm_sync_password';
const choresKey='moiritm_home_chores_v1';

const defaultChores=['Прибить полку','Разобрать вещи в кладовке','Протереть полки','Починить кран','Разобрать почту'];

function loadDayChores(){try{return JSON.parse(localStorage.getItem(dayChoresKey)||'{}')||{}}catch(e){return {}}}
let dayChores=loadDayChores();
function saveDayChores(){try{localStorage.setItem(dayChoresKey,JSON.stringify(dayChores))}catch(e){}}
function getSelectedChores(day){
  const key=dateKey(day);
  if(dayChores[key]&&Array.isArray(dayChores[key])&&dayChores[key].length)return dayChores[key];
  return [];
}
function setSelectedChores(day,list){
  const key=dateKey(day);
  dayChores[key]=list;
  saveDayChores();
}
function load(){try{return JSON.parse(localStorage.getItem(storeKey))||{checks:{},habits:{},completedChores:{}}}catch(e){return {checks:{},habits:{},completedChores:{}}}}
let state=load();
if(!state.completedChores||typeof state.completedChores!=='object')state.completedChores={};
function currentWeekKey(){
  const d=new Date(); const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day); d.setHours(12,0,0,0);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
if(state.habitWeek!==currentWeekKey()){state.habits={};state.habitWeek=currentWeekKey();try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){} scheduleSync()}
function dateKey(day=selectedDay){const d=new Date();d.setDate(d.getDate()+((day-d.getDay()+7)%7));return d.toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function taskId(day,i){return dateKey(day)+'_'+i}
function hueForTask(t,i){return (String(t[1]).length*3+i*5)%8}
function taskCard(t,i,day){
 let id=taskId(day,i),done=!!state.checks[id],cat=t[2]||'rest';
 let title=t[1];
 let choreExtra='';
 if(title==='Домашние дела'){
   const selected=getSelectedChores(day);
   if(selected.length){
     title='Домашние дела';
     choreExtra=`<div class="chore-lines">${selected.map(c=>'• '+esc(c)).join('<br>')}</div>`;
   }else{
     title='Домашние дела';
     choreExtra=`<div class="chore-lines" style="color:var(--muted)">Нажми «Выбрать дела»</div>`;
   }
 }
 const hue=hueForTask(t,i);
 return `<div class="card task-tile cat-${esc(cat)}" data-hue="${hue}" data-idx="${i}" draggable="true">
  <div class="task">
    <button class="check ${done?'done':''}" aria-label="Отметить задачу" onclick="event.stopPropagation();toggleTask('${id}',${day},${i})"></button>
    <div class="task-main">
      <div class="task-title ${done?'done':''}">${esc(title)}</div>
      ${choreExtra}
      <div class="task-meta"><span class="pill">${esc(categoryName(cat))}</span>${t[3]?`<span>${esc(t[3])}</span>`:''}</div>
    </div>
    <div class="task-actions">
      <span class="drag-handle" title="Перетащить">⋮⋮</span>
      <div class="time">${esc(t[0])}</div>
      ${t[1]==='Домашние дела'?`<button class="edit-task" onclick="event.stopPropagation();openChorePicker(${day},${i})">Выбрать дела</button>`:''}
      <button class="edit-task" onclick="event.stopPropagation();editTask(${day},${i})">Изменить</button>
      ${t[4]==='custom'?`<button class="edit-task" onclick="event.stopPropagation();deleteCustomTask(${day},${i})">Удалить</button>`:''}
    </div>
  </div>
</div>`;
}
function categoryName(c){return ({sport:'Спорт',family:'Семья',home:'Дом',hobby:'Хобби',rest:'Отдых',work:'Работа'})[c]||'План'}
function persistSchedule(){try{localStorage.setItem('moiritm_custom_schedule_v1',JSON.stringify(schedule))}catch(e){alert('Не удалось сохранить расписание.')} scheduleSync()}
function openTaskEditor(day,index=null){

 <div class="field"><label>Название</label><input id="taskTitleInput" maxlength="90" required value="${esc(t[1])}" placeholder="Например, занятие гитарой"></div>
 <div class="field"><label>День недели</label><select id="taskDayInput">${DAYS.map((d,i)=>`<option value="${i}" ${i===day?'selected':''}>${d}</option>`).join('')}</select></div>
 <div class="field"><label>Время или период</label><input id="taskTimeInput" maxlength="25" value="${esc(t[0])}" placeholder="Например, 18:00"></div>
 <div class="field"><label>Категория</label><select id="taskCategoryInput">${[['hobby','Хобби'],['home','Дом'],['family','Семья'],['sport','Спорт'],['rest','Отдых'],['work','Работа']].map(([v,n])=>`<option value="${v}" ${v===t[2]?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="field"><label>Описание</label><textarea id="taskDescInput" maxlength="180">${esc(t[3]||'')}</textarea></div>
 <div class="button-row"><button class="action" type="submit">Сохранить</button><button class="secondary" type="button" onclick="closeTaskEditor()">Отмена</button></div></form></div></div>`;
}
function closeTaskEditor(){document.getElementById('modalRoot').innerHTML=''}
function saveTaskEditor(e,oldDay,index){
 e.preventDefault();const day=Number(document.getElementById('taskDayInput').value);
 const task=[document.getElementById('taskTimeInput').value.trim(),document.getElementById('taskTitleInput').value.trim(),document.getElementById('taskCategoryInput').value,document.getElementById('taskDescInput').value.trim(),'custom'];
 if(!task[1])return;
 if(index===null)schedule[day].tasks.push(task);
 else if(day===oldDay)schedule[day].tasks[index]=task;
 else{
   const oldId=taskId(oldDay,index),wasDone=!!state.checks[oldId];
   schedule[oldDay].tasks.splice(index,1);schedule[day].tasks.push(task);
   delete state.checks[oldId];
   if(wasDone)state.checks[taskId(day,schedule[day].tasks.length-1)]=true;
   reindexChecks(oldDay,index);
 }
 persistSchedule();save();closeTaskEditor();render();
}
function editTask(day,i){openTaskEditor(day,i)}
function reindexChecks(day,from){
 const prefix=dateKey(day)+'_';
 for(let j=from+1;j<=schedule[day].tasks.length;j++){
   const oldKey=prefix+j,newKey=prefix+(j-1);
   if(state.checks[oldKey])state.checks[newKey]=true;else delete state.checks[newKey];
   delete state.checks[oldKey];
 }
}
function deleteCustomTask(day,i){
 if(!confirm('Удалить эту задачу?'))return;
 delete state.checks[taskId(day,i)];schedule[day].tasks.splice(i,1);reindexChecks(day,i);persistSchedule();save();render();
}

    <div class="button-row">
      <button class="action" onclick="saveChorePicker(${day})">Сохранить</button>
      <button class="secondary" type="button" onclick="closeTaskEditor()">Отмена</button>

function toggleChoreChip(btn){
  btn.classList.toggle('selected');
}
function saveChorePicker(day){
  const area=document.getElementById('chorePickArea');
  if(!area)return;
  const list=[...area.querySelectorAll('.chore-chip.selected')].map(b=>b.dataset.chore);
  setSelectedChores(day,list);
  scheduleSync();
  closeTaskEditor();

}
function toggleTask(id,day,idx){
  const was=!!state.checks[id];
  state.checks[id]=!was;
  if(day!=null&&idx!=null){
    const t=schedule[day]&&schedule[day].tasks[idx];
    if(t&&t[1]==='Домашние дела'){
      const selected=getSelectedChores(day);
      if(!was){
        selected.forEach(c=>{state.completedChores[c]=true});
      }
    }
  }
  save();render();
}
function getWeekProgress(){
  let total=0,done=0;
  for(let d=0;d<7;d++){
    const tasks=schedule[d]?schedule[d].tasks:[];
    total+=tasks.length;
    for(let i=0;i<tasks.length;i++){
      if(state.checks[taskId(d,i)])done++;
    }
  }
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function getChoresProgress(){
  const total=homeChores.length||0;
  let done=0;
  homeChores.forEach(c=>{if(state.completedChores[c])done++});
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function renderCounters(){
  const box=document.getElementById('mainCounters');
  if(!box)return;
  if(page!=='today'){box.innerHTML='';box.classList.add('hidden');return}
  box.classList.remove('hidden');
  const w=getWeekProgress();
  const c=getChoresProgress();
  box.innerHTML=`
    <div class="counter-card week">
      <div class="c-label">Прогресс недели</div>
      <div class="c-value">${w.done} / ${w.total}</div>
      <div class="c-bar"><span style="width:${w.pct}%"></span></div>
    </div>
    <div class="counter-card chores">
      <div class="c-label">Домашние дела</div>
      <div class="c-value">${c.done} / ${c.total}</div>
      <div class="c-bar"><span style="width:${c.pct}%"></span></div>
    </div>`;
}
/* ---- Drag & Drop reorder ---- */
let dragIdx=null;
function bindDragDrop(){
  const cards=[...document.querySelectorAll('.card.task-tile[data-idx]')];
  cards.forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragIdx=Number(card.dataset.idx);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',String(dragIdx));
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      cards.forEach(c=>c.classList.remove('drag-over'));
      dragIdx=null;
    });
    card.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      cards.forEach(c=>c.classList.remove('drag-over'));
      if(Number(card.dataset.idx)!==dragIdx)card.classList.add('drag-over');
    });
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      const toIdx=Number(card.dataset.idx);
      if(dragIdx==null||toIdx===dragIdx)return;
      reorderTasks(selectedDay,dragIdx,toIdx);
    });
    // Touch support (simple long-press free drag approximation via pointer)
    let touchStartY=0,touchCard=null;
    card.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      touchStartY=e.touches[0].clientY;
      touchCard=card;
      dragIdx=Number(card.dataset.idx);
    },{passive:true});
    card.addEventListener('touchmove',e=>{
      if(!touchCard||dragIdx==null)return;
      const y=e.touches[0].clientY;
      const over=document.elementFromPoint(e.touches[0].clientX,y);
      const target=over&&over.closest('.card.task-tile[data-idx]');
      cards.forEach(c=>c.classList.remove('drag-over'));
      if(target&&Number(target.dataset.idx)!==dragIdx)target.classList.add('drag-over');
    },{passive:true});
    card.addEventListener('touchend',e=>{
      if(dragIdx==null)return;
      const t=e.changedTouches[0];
      const over=document.elementFromPoint(t.clientX,t.clientY);
      const target=over&&over.closest('.card.task-tile[data-idx]');
      cards.forEach(c=>c.classList.remove('drag-over'));
      if(target){
        const toIdx=Number(target.dataset.idx);
        if(toIdx!==dragIdx)reorderTasks(selectedDay,dragIdx,toIdx);
      }
      dragIdx=null;touchCard=null;
    });
  });
}
function reorderTasks(day,from,to){
  const tasks=schedule[day].tasks;
  if(from===to||from<0||to<0||from>=tasks.length||to>=tasks.length)return;
  const prefix=dateKey(day)+'_';
  // Snapshot done flags in current order
  const doneFlags=tasks.map((_,i)=>!!state.checks[prefix+i]);
  // Reorder tasks
  const [item]=tasks.splice(from,1);
  tasks.splice(to,0,item);
  // Reorder flags the same way
  const [flag]=doneFlags.splice(from,1);
  doneFlags.splice(to,0,flag);
  // Write back
  tasks.forEach((_,i)=>{
    if(doneFlags[i])state.checks[prefix+i]=true;
    else delete state.checks[prefix+i];
  });
  // Clean possible leftover higher keys
  for(let i=tasks.length;i<tasks.length+5;i++)delete state.checks[prefix+i];
  persistSchedule();
  save();
  render();
}

  const pwd=getPassword();
  html+=`<div class="section-head"><h2>Облачная синхронизация</h2><span class="sub" id="syncStatusLabel">${syncStatusText()}</span></div><div class="sync-box"><div class="field"><label>Пароль синхронизации</label><input id="syncPwdInput" type="password" autocomplete="off" value="${esc(pwd)}" placeholder="Придумай общий пароль для устройств"></div><div class="button-row"><button class="action" onclick="savePasswordFromUI()">Сохранить пароль</button><button class="secondary" onclick="testSync()">Проверить подключение</button></div><p class="note">Один и тот же пароль вводи на всех устройствах. Данные хранятся в Cloudflare Worker. При ошибке локальные данные не удаляются.</p><div class="sync-status ${syncStatusClass()}" id="syncStatusInline">${syncStatusText()}</div></div>`;
  html+=`<div class="button-row" style="margin-top:18px"><button class="secondary" onclick="exportData()">Экспортировать данные</button><button class="secondary" onclick="importData()">Импортировать данные</button></div><p class="note">Экспорт сохраняет отметки, недельный чек-лист и всё расписание, включая добавленные и изменённые задачи. Храни файл отдельно; импорт заменит текущие данные.</p>`;
  document.getElementById('main').innerHTML=html;
}
function saveChoresFromUI(){
  const ta=document.getElementById('choresInput');
  if(!ta)return;
  homeChores=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!homeChores.length)homeChores=defaultChores.slice();
  saveChores();
  scheduleSync();
  alert('Список домашних дел сохранён.');
  render();
}
function exportData(){let backup={version:4,exportedAt:new Date().toISOString(),state,schedule,homeChores,dayChores};let blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moiritm-backup.json';a.click();URL.revokeObjectURL(url)}
function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;const restored=d.state||d;if(!restored||typeof restored!=='object'||!restored.checks)throw 0;state={...restored,checks:restored.checks||{},habits:restored.habits||{},completedChores:restored.completedChores||{}};if(d.schedule&&typeof d.schedule==='object'){Object.keys(schedule).forEach(k=>{if(d.schedule[k]&&Array.isArray(d.schedule[k].tasks))schedule[k]=d.schedule[k]});persistSchedule()}if(Array.isArray(d.homeChores)&&d.homeChores.length){homeChores=d.homeChores;saveChores()}if(d.dayChores&&typeof d.dayChores==='object'){dayChores=d.dayChores;saveDayChores()}save();render();alert('Резервная копия загружена: отметки, чек-листы и расписание.')}catch(e){alert('Не удалось прочитать этот файл.')}};r.readAsText(f)};input.click()}
function setNav(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function render(){
  let d=new Date();
  document.getElementById('todayLabel').innerHTML=`${DAYS[d.getDay()]}<br>${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}<div class="sync-status ${syncStatusClass()}" id="topSyncStatus">${syncStatusText()}</div>`;
  setNav();
  if(page==='today')renderToday();
  else if(page==='week')renderWeek();
  else if(page==='habits')renderHabits();
  else renderStats();
}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()}));

/* ========== Cloud Sync ========== */
let syncStatus='unset';
let syncTimer=null;
let syncInFlight=false;
let pendingSync=false;
let lastLocalChange=0;
let lastCloudVersion=0;

function getPassword(){try{return localStorage.getItem(pwdKey)||''}catch(e){return ''}}
function setPassword(p){try{if(p)localStorage.setItem(pwdKey,p);else localStorage.removeItem(pwdKey)}catch(e){}}
function syncStatusText(){
  if(syncStatus==='busy')return 'Синхронизация…';
  if(syncStatus==='ok')return 'Синхронизировано';
  if(syncStatus==='error')return 'Ошибка синхронизации';
  return getPassword()?'Готово к синхронизации':'Не настроено';
}
function syncStatusClass(){
  if(syncStatus==='busy')return 'busy';
  if(syncStatus==='ok')return 'ok';
  if(syncStatus==='error')return 'err';
  return '';
}
function updateSyncUI(){
  const t=syncStatusText(),c=syncStatusClass();
  const el1=document.getElementById('topSyncStatus');
  if(el1){el1.textContent=t;el1.className='sync-status '+c}
  const el2=document.getElementById('syncStatusInline');
  if(el2){el2.textContent=t;el2.className='sync-status '+c}
  const el3=document.getElementById('syncStatusLabel');
  if(el3)el3.textContent=t;
}
function buildPayload(){
  return {
    version:4,
    updatedAt:new Date().toISOString(),
    localChangeTs:lastLocalChange||Date.now(),
    state,
    schedule,
    homeChores,
    dayChores
  };
}
function applyCloudData(data){
  if(!data||typeof data!=='object')return false;
  const cloudState=data.state;
  const cloudSchedule=data.schedule;
  const cloudChores=data.homeChores;
  let applied=false;
  if(cloudState&&typeof cloudState==='object'){
    const hasChecks=cloudState.checks&&Object.keys(cloudState.checks).length>0;
    const hasHabits=cloudState.habits&&Object.keys(cloudState.habits).length>0;
    const localHas=Object.keys(state.checks||{}).length>0||Object.keys(state.habits||{}).length>0;
    if(hasChecks||hasHabits||!localHas){
      state={
        checks:cloudState.checks||{},
        habits:cloudState.habits||{},
        habitWeek:cloudState.habitWeek||currentWeekKey(),
        completedChores:cloudState.completedChores||state.completedChores||{}
      };
      applied=true;
    }
  }
  if(cloudSchedule&&typeof cloudSchedule==='object'){
    let any=false;
    Object.keys(schedule).forEach(k=>{
      if(cloudSchedule[k]&&Array.isArray(cloudSchedule[k].tasks)&&cloudSchedule[k].tasks.length){
        schedule[k]=cloudSchedule[k];
        any=true;
      }
    });
    if(any){try{localStorage.setItem('moiritm_custom_schedule_v1',JSON.stringify(schedule))}catch(e){} applied=true}
  }
  if(Array.isArray(cloudChores)&&cloudChores.length){
    homeChores=cloudChores;
    saveChores();
    applied=true;
  }
  if(data.dayChores&&typeof data.dayChores==='object'){
    dayChores=data.dayChores;
    saveDayChores();
    applied=true;
  }
  if(applied){
    try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}
    if(data.localChangeTs)lastCloudVersion=data.localChangeTs;
  }
  return applied;
}
async function pullFromCloud(){
  const pwd=getPassword();
  if(!pwd){syncStatus='unset';updateSyncUI();return}
  if(!navigator.onLine){syncStatus='error';updateSyncUI();return}
  syncStatus='busy';updateSyncUI();
  try{
    const res=await fetch(SYNC_URL+'/data',{
      method:'GET',
      headers:{'X-Sync-Password':pwd,'Content-Type':'application/json','Accept':'application/json'},
      cache:'no-store'
    });
    if(res.status===401||res.status===403){syncStatus='error';updateSyncUI();return}
    if(res.status===404||res.status===204){
      syncStatus='ok';updateSyncUI();
      pushToCloud(true);
      return;
    }
    if(!res.ok){syncStatus='error';updateSyncUI();return}
    const data=await res.json().catch(()=>null);
    if(data&&typeof data==='object'){
      const cloudTs=data.localChangeTs||0;
      if(cloudTs>=lastCloudVersion||!lastLocalChange){
        applyCloudData(data);
        lastCloudVersion=cloudTs||Date.now();
      }
    }
    syncStatus='ok';updateSyncUI();
  }catch(e){
    syncStatus='error';updateSyncUI();
  }
}
async function pushToCloud(force){
  const pwd=getPassword();
  if(!pwd){syncStatus='unset';updateSyncUI();return}
  if(!navigator.onLine){syncStatus='error';updateSyncUI();return}
  if(syncInFlight){pendingSync=true;return}
  syncInFlight=true;
  syncStatus='busy';updateSyncUI();
  try{
    const payload=buildPayload();
    const res=await fetch(SYNC_URL+'/data',{
      method:'PUT',
      headers:{'X-Sync-Password':pwd,'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(payload)
    });
    if(res.status===401||res.status===403){syncStatus='error';updateSyncUI();syncInFlight=false;return}
    if(!res.ok){syncStatus='error';updateSyncUI();syncInFlight=false;if(pendingSync){pendingSync=false;setTimeout(()=>pushToCloud(true),800)}return}
    lastCloudVersion=payload.localChangeTs;
    syncStatus='ok';updateSyncUI();
  }catch(e){
    syncStatus='error';updateSyncUI();
  }finally{
    syncInFlight=false;
    if(pendingSync){pendingSync=false;setTimeout(()=>pushToCloud(true),400)}
  }
}
function scheduleSync(){
  lastLocalChange=Date.now();
  if(!getPassword()){syncStatus='unset';updateSyncUI();return}
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{syncTimer=null;pushToCloud()},650);
}
function savePasswordFromUI(){
  const inp=document.getElementById('syncPwdInput');
  if(!inp)return;
  const p=inp.value.trim();
  setPassword(p);
  if(p){
    syncStatus='busy';updateSyncUI();
    pullFromCloud().then(()=>{if(syncStatus!=='error')pushToCloud(true)});
  }else{
    syncStatus='unset';updateSyncUI();
  }
  render();
}
async function testSync(){
  const inp=document.getElementById('syncPwdInput');
  const p=(inp?inp.value.trim():'')||getPassword();
  if(!p){alert('Сначала введите пароль.');return}
  setPassword(p);
  syncStatus='busy';updateSyncUI();
  try{
    const res=await fetch(SYNC_URL+'/data',{
      method:'GET',
      headers:{'X-Sync-Password':p,'Content-Type':'application/json','Accept':'application/json'},
      cache:'no-store'
    });
    if(res.status===401||res.status===403){
      syncStatus='error';updateSyncUI();
      alert('Неверный пароль или доступ запрещён.');
      return;
    }
    if(res.ok||res.status===404||res.status===204){
      syncStatus='ok';updateSyncUI();
      alert('Подключение успешно.');
      pushToCloud(true);
    }else{
      syncStatus='error';updateSyncUI();
      alert('Ошибка сервера: '+res.status);
    }
  }catch(e){
    syncStatus='error';updateSyncUI();
    alert('Нет сети или Worker недоступен.');
  }
}
window.addEventListener('online',()=>{
  if(getPassword()){
    pullFromCloud().then(()=>pushToCloud(true));
  }
});
(async function initSync(){
  if(getPassword()){
    await pullFromCloud();
  }else{
    syncStatus='unset';
  }
  render();
})();
render();
</script>
