<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мой ритм">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Мой ритм — планер</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#202229;--line:#2b2e36;--text:#f3f4f6;--muted:#9b9eaa;--accent:#c7f36b;--accentText:#171b0c;--blue:#9bbcff;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}
.wrap{max-width:680px;margin:auto;padding:18px 16px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 22px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.brand{font-size:24px;font-weight:750;letter-spacing:-.04em}.date{font-size:13px;color:var(--muted);text-align:right}.hero{background:linear-gradient(135deg,#22272b,#1a1c21 65%);border:1px solid var(--line);border-radius:26px;padding:22px;margin-bottom:18px}.hero h1{font-size:28px;line-height:1.12;letter-spacing:-.04em;margin:7px 0 8px}.hero p{color:var(--muted);margin:0 0 18px;font-size:14px}.hero-row{display:flex;align-items:center;gap:12px}.progress{height:7px;background:#343740;border-radius:10px;overflow:hidden;flex:1}.progress span{display:block;height:100%;width:0;background:var(--accent);border-radius:10px;transition:width .2s}.progress-label{font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:7px;background:#17181c;border:1px solid var(--line);padding:5px;border-radius:15px;margin-bottom:20px}.tab{flex:1;padding:11px 4px;border-radius:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:650}.tab.active{background:#30333a;color:var(--text)}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 11px}.section-head h2{font-size:19px;margin:0;letter-spacing:-.03em}.sub{font-size:12px;color:var(--muted)}
.day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 17px}.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 2px 9px;text-align:center;min-width:0}.day .dow{font-size:10px;color:var(--muted);text-transform:uppercase}.day .num{font-size:17px;font-weight:700;margin-top:3px}.day.selected{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.day.selected .dow{color:#48522e}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:10px}
.card.task-tile{border:0;position:relative;overflow:hidden}
.card.task-tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tile)}
.card.task-tile.cat-home{background:#26332f;--tile:#74c7a4}.card.task-tile.cat-hobby{background:#302b3c;--tile:#b69be8}
.card.task-tile.cat-sport{background:#3a3025;--tile:#e9ae68}.card.task-tile.cat-family{background:#3a2b32;--tile:#e69bb4}
.card.task-tile.cat-rest{background:#263345;--tile:#8eb9ee}.card.task-tile.cat-work{background:#30343a;--tile:#aeb9c8}
.task-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.add-task-btn{width:100%;padding:14px;border:1px dashed #626875;background:#1c2027;color:var(--text);border-radius:15px;font-weight:700;margin:8px 0 12px}
.modal-backdrop{position:fixed;inset:0;background:#000b;display:grid;place-items:end center;padding:14px;z-index:30}
.modal{width:100%;max-width:560px;background:#202229;border:1px solid var(--line);border-radius:22px;padding:20px;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 15px;font-size:20px}.field{display:grid;gap:6px;margin:11px 0}
.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#14161b;border:1px solid #3a3e48;color:var(--text);padding:12px;border-radius:11px}
.field textarea{min-height:70px;resize:vertical}
.task{display:flex;gap:12px;align-items:flex-start}.check{width:25px;height:25px;flex:0 0 25px;border-radius:9px;border:1.5px solid #555964;background:transparent;display:grid;place-items:center;margin-top:1px}.check.done{background:var(--accent);border-color:var(--accent);color:var(--accentText)}.check.done:after{content:"✓";font-weight:900}.task-main{flex:1;min-width:0}.task-title{font-weight:650;font-size:15px}.task-title.done{text-decoration:line-through;color:var(--muted)}.task-meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px;margin-top:4px;flex-wrap:wrap}.pill{background:var(--panel2);border-radius:7px;padding:4px 7px}.task-desc{font-size:13px;color:var(--muted);margin-top:7px}.time{font-size:12px;color:var(--blue);font-weight:650;white-space:nowrap}.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:18px}
.week-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.week-row:last-child{border-bottom:0}.week-day{width:78px;flex-shrink:0;font-size:13px;font-weight:700}.week-info{flex:1;min-width:0}.week-info strong{display:block;font-size:14px}.week-info span{font-size:12px;color:var(--muted)}.mini-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;display:inline-block;margin-right:6px}
.list-item{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.list-item input{accent-color:var(--accent);width:19px;height:19px}.list-item label{flex:1;font-size:14px}.list-item small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.stat .big{font-size:25px;font-weight:750;letter-spacing:-.04em}.stat .label{font-size:12px;color:var(--muted);margin-top:3px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(16,17,20,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.nav-inner{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav-btn{background:transparent;color:var(--muted);border-radius:12px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}.nav-btn .ico{font-size:19px}.nav-btn.active{color:var(--accent);background:#22251d}
.edit-task{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:6px 8px;font-size:12px;white-space:nowrap}.action{background:var(--accent);color:var(--accentText);font-weight:750;border-radius:12px;padding:12px 15px}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px}.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px}.hidden{display:none!important}.footer{color:#666a75;text-align:center;font-size:11px;padding:18px 0}
@media(min-width:600px){.wrap{padding:28px 24px}.hero h1{font-size:34px}.day-strip{gap:9px}.day{padding:13px 4px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="eyebrow">Личный планер</div><div class="brand">Мой ритм<span style="color:var(--accent)">.</span></div></div><div class="date" id="todayLabel"></div></header>
<section class="hero"><div class="eyebrow" id="heroEyebrow">ПЛАН НА СЕГОДНЯ</div><h1 id="heroTitle">Спокойный ритм,<br>без гонки.</h1><p id="heroText">Одно главное дело — уже хороший день.</p><div class="hero-row"><div class="progress"><span id="progressBar"></span></div><div class="progress-label" id="progressLabel">0 из 0 дел</div></div></section>
<div class="tabs" id="dayTabs"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="hobby">Хобби</button><button class="tab" data-filter="home">Дом</button><button class="tab" data-filter="family">Семья</button></div>
<main id="main"></main><div class="footer">Твои планы · хранятся на этом устройстве</div>
</div>
<div id="modalRoot"></div>
<nav class="bottom-nav"><div class="nav-inner">
<button class="nav-btn active" data-page="today"><span class="ico">◷</span>Сегодня</button>
<button class="nav-btn" data-page="week"><span class="ico">▦</span>Неделя</button>
<button class="nav-btn" data-page="habits"><span class="ico">✓</span>Чек-листы</button>
<button class="nav-btn" data-page="stats"><span class="ico">↗</span>Прогресс</button>
</div></nav>
<script>
const DAYS=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const SHORT=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const schedule={
0:{title:'Дом, аквариум и личное время',text:'Спокойно подготовься к новой неделе.',tasks:[
['09:00','Завтрак и спокойное утро','home','Без спешки'],['10:00','Уборка, стирка и покупки','home','Основные домашние дела'],['12:00','Обед и отдых','family','Пауза между делами'],['13:00','Обслуживание аквариума','home','Ориентир: 60–90 минут'],['14:30','Баскетбол · броски','sport','30 минут на свежем воздухе'],['15:00','Свободное хобби','hobby','3D-печать, гитара или коктейли'],['17:00','Подготовиться к понедельнику','home','Коротко проверить планы'],['19:30','Прогулка с собакой','family','Ориентир — 20–30 минут']]},
1:{title:'Бассейн и день для семьи',text:'До 18:00 — семья и совместные планы. Никаких обязательных проектов.',tasks:[
['Утро','Бассейн с женой','family','Главный план дня'],['После бассейна','Время вместе','family','Завтрак, прогулка, поездки или отдых'],['До 18:00','Семейные дела и отдых','family','Личные проекты не планируем'],['После 18:00','Свободный вечер','rest','Хобби — только если хочется']]},
2:{title:'3D-печать и Ozon',text:'Продвинь магазин одним конкретным шагом.',tasks:[
['17:00','Перекус и переключение','rest','20 минут после работы'],['17:20','3D-печать и Ozon','hobby','Карточка товара, заказ, модель или себестоимость'],['19:00','Закончить дела и подготовиться','home','Сохранить результат, убрать место'],['19:30','Прогулка с собакой','family','Обычно вместе с женой · 20–30 минут']]},
3:{title:'Баскетбол и свободный вечер',text:'Короткая тренировка рядом с домом — без долгой подготовки.',tasks:[
['17:00','Перекус и переключение','rest','После работы'],['17:30','Баскетбол · броски','sport','5 минут разминки, 20 минут бросков, 5 минут штрафных'],['18:00','Гитара или свободное время','hobby','По желанию, без обязательств'],['19:30','Прогулка с собакой','family','Ориентир — 20–30 минут']]},
4:{title:'Home Assistant',text:'Одна техническая задача за сессию. Скалодром пока остаётся резервом.',tasks:[
['17:00','Перекус и переключение','rest','После работы'],['17:20','Home Assistant','hobby','Одна автоматизация, интеграция или настройка'],['19:00','Завершить занятие','home','Записать следующий шаг'],['19:30','Прогулка с собакой','family','Ориентир — 20–30 минут']]},
5:{title:'Гитара и лёгкие дела',text:'Не превращай пятницу в ещё один рабочий день.',tasks:[
['17:00','Перекус и переключение','rest','После работы'],['17:20','Гитара','hobby','20–30 минут практики'],['18:00','Свободное время или мелкие дела','home','Только если есть силы'],['19:30','Прогулка с собакой','family','Ориентир — 20–30 минут']]},
6:{title:'Рабочий день и лёгкий вечер',text:'После работы — отдых. Баскетбол только если есть силы.',tasks:[
['17:00','Перекус и переключение','rest','После работы'],['17:30','Баскетбол · по желанию','sport','30 минут, если погода и силы позволяют'],['18:15','Свободный вечер','rest','Необязательное хобби — по настроению'],['19:30','Прогулка с собакой','family','Ориентир — 20–30 минут']]}
};
try{
  const savedSchedule=JSON.parse(localStorage.getItem('moiritm_custom_schedule_v1')||'null');
  if(savedSchedule){Object.keys(schedule).forEach(k=>{if(savedSchedule[k]&&Array.isArray(savedSchedule[k].tasks))schedule[k]=savedSchedule[k]})}
}catch(e){}
const habitGroups=[
{title:'Дом и быт',items:[['Покупки и подготовка еды','В воскресенье или по пути домой'],['Уборка и стирка','Основной блок — воскресенье'],['Обслуживание аквариума','Воскресенье · 60–90 минут']]},
{title:'Хобби',items:[['Продвинул 3D-печать / Ozon','Одна конкретная задача'],['Занялся Home Assistant или скалодромом','Скалодром пока резервный слот'],['Гитара 2–3 раза','По 20–30 минут'],['Баскетбол хотя бы 2 раза','Короткие блоки по 30 минут'],['Коктейли или другое хобби','Один свободный блок по желанию']]},
{title:'Баланс',items:[['Провёл время с женой и семьёй','Понедельник до 18:00 — семейное время'],['Оставил время для отдыха','Не нужно заполнять каждое окно'],['Не жертвовал сном','Ориентир — лечь около 23:00']]}
];
let page='today',filter='all',selectedDay=new Date().getDay();
const storeKey='moiritm_planner_v1';
function load(){try{return JSON.parse(localStorage.getItem(storeKey))||{checks:{},habits:{}}}catch(e){return {checks:{},habits:{}}}}
let state=load();
function currentWeekKey(){
  const d=new Date(); const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day); d.setHours(12,0,0,0);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
if(state.habitWeek!==currentWeekKey()){state.habits={};state.habitWeek=currentWeekKey();try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}
function dateKey(day=selectedDay){const d=new Date();d.setDate(d.getDate()+((day-d.getDay()+7)%7));return d.toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function taskId(day,i){return dateKey(day)+'_'+i}
function taskCard(t,i,day){
 let id=taskId(day,i),done=!!state.checks[id],cat=t[2]||'rest';
 return `<div class="card task-tile cat-${esc(cat)}"><div class="task"><button class="check ${done?'done':''}" aria-label="Отметить выполнение" onclick="toggleTask('${id}')"></button><div class="task-main"><div class="task-title ${done?'done':''}">${esc(t[1])}</div><div class="task-meta"><span class="pill">${esc(categoryName(cat))}</span>${t[3]?`<span>${esc(t[3])}</span>`:''}</div></div><div class="task-actions"><div class="time">${esc(t[0])}</div><button class="edit-task" onclick="editTask(${day},${i})">Изменить</button>${t[4]==='custom'?`<button class="edit-task" onclick="deleteCustomTask(${day},${i})">Удалить</button>`:''}</div></div></div>`;
}
function categoryName(c){return ({sport:'Спорт',family:'Семья',home:'Дом',hobby:'Хобби',rest:'Отдых',work:'Работа'})[c]||'План'}
function persistSchedule(){try{localStorage.setItem('moiritm_custom_schedule_v1',JSON.stringify(schedule))}catch(e){alert('Не удалось сохранить расписание.')}}
function openTaskEditor(day,index=null){
 const t=index===null?['','','hobby','']:schedule[day].tasks[index];
 document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeTaskEditor()"><div class="modal"><h2>${index===null?'Новая задача':'Изменить задачу'}</h2><form onsubmit="saveTaskEditor(event,${day},${index===null?'null':index})">
 <div class="field"><label>Название</label><input id="taskTitleInput" maxlength="90" required value="${esc(t[1])}" placeholder="Например, занятие гитарой"></div>
 <div class="field"><label>День недели</label><select id="taskDayInput">${DAYS.map((d,i)=>`<option value="${i}" ${i===day?'selected':''}>${d}</option>`).join('')}</select></div>
 <div class="field"><label>Время или период</label><input id="taskTimeInput" maxlength="25" value="${esc(t[0])}" placeholder="Например, 18:00"></div>
 <div class="field"><label>Категория</label><select id="taskCategoryInput">${[['hobby','Хобби'],['home','Дом'],['family','Семья'],['sport','Спорт'],['rest','Отдых'],['work','Работа']].map(([v,n])=>`<option value="${v}" ${v===t[2]?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="field"><label>Описание</label><textarea id="taskDescInput" maxlength="180">${esc(t[3]||'')}</textarea></div>
 <div class="button-row"><button class="action" type="submit">Сохранить</button><button class="secondary" type="button" onclick="closeTaskEditor()">Отмена</button></div></form></div></div>`;
}
function closeTaskEditor(){document.getElementById('modalRoot').innerHTML=''}
function saveTaskEditor(e,oldDay,index){
 e.preventDefault();const day=Number(document.getElementById('taskDayInput').value);
 const task=[document.getElementById('taskTimeInput').value.trim(),document.getElementById('taskTitleInput').value.trim(),document.getElementById('taskCategoryInput').value,document.getElementById('taskDescInput').value.trim(),'custom'];
 if(!task[1])return;
 if(index===null)schedule[day].tasks.push(task);
 else if(day===oldDay)schedule[day].tasks[index]=task;
 else{
   const oldId=taskId(oldDay,index),wasDone=!!state.checks[oldId];
   schedule[oldDay].tasks.splice(index,1);schedule[day].tasks.push(task);
   delete state.checks[oldId];
   if(wasDone)state.checks[taskId(day,schedule[day].tasks.length-1)]=true;
   reindexChecks(oldDay,index);
 }
 persistSchedule();save();closeTaskEditor();render();
}
function editTask(day,i){openTaskEditor(day,i)}
function reindexChecks(day,from){
 const prefix=dateKey(day)+'_';
 for(let j=from+1;j<=schedule[day].tasks.length;j++){
   const oldKey=prefix+j,newKey=prefix+(j-1);
   if(state.checks[oldKey])state.checks[newKey]=true;else delete state.checks[newKey];
   delete state.checks[oldKey];
 }
}
function deleteCustomTask(day,i){
 if(!confirm('Удалить эту задачу?'))return;
 delete state.checks[taskId(day,i)];schedule[day].tasks.splice(i,1);reindexChecks(day,i);persistSchedule();save();render();
}
function toggleTask(id){state.checks[id]=!state.checks[id];save();render()}
function renderToday(){let s=schedule[selectedDay];document.getElementById('heroEyebrow').textContent='ПЛАН НА '+(selectedDay===new Date().getDay()?'СЕГОДНЯ':DAYS[selectedDay].toUpperCase());document.getElementById('heroTitle').textContent=s.title;document.getElementById('heroText').textContent=s.text;
let all=s.tasks.map((t,i)=>({t,i})).filter(o=>filter==='all'||(filter==='home'&&o.t[2]==='home')||(filter==='hobby'&&(o.t[2]==='hobby'||o.t[2]==='sport'))||(filter==='family'&&o.t[2]==='family'));
let completed=s.tasks.filter((t,i)=>state.checks[taskId(selectedDay,i)]).length;document.getElementById('progressBar').style.width=(s.tasks.length?completed/s.tasks.length*100:0)+'%';document.getElementById('progressLabel').textContent=`${completed} из ${s.tasks.length} дел`;
let html=`<div class="section-head"><h2>День за днём</h2><span class="sub">Выбери день</span></div><div class="day-strip">`;
for(let k=0;k<7;k++){let d=new Date();d.setDate(d.getDate()+((k-d.getDay()+7)%7));html+=`<button class="day ${selectedDay===k?'selected':''}" onclick="selectDay(${k})"><div class="dow">${SHORT[k]}</div><div class="num">${d.getDate()}</div></button>`}
html+='</div><div class="section-head"><h2>'+DAYS[selectedDay]+'</h2><span class="sub">'+all.length+' пунктов</span></div>';
html+=all.length?all.map(o=>taskCard(o.t,o.i,selectedDay)).join(''):'<div class="empty">В этой категории на сегодня ничего нет.</div>';
html+=`<button class="add-task-btn" onclick="openTaskEditor(${selectedDay})">＋ Добавить свою задачу</button>`;
html+=`<div class="button-row"><button class="secondary" onclick="clearDay()">Сбросить отметки дня</button></div>`;
document.getElementById('main').innerHTML=html;document.getElementById('dayTabs').classList.remove('hidden')}
function selectDay(d){selectedDay=d;filter='all';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));render()}

function exportData(){let backup={version:2,exportedAt:new Date().toISOString(),state,schedule};let blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moiritm-backup.json';a.click();URL.revokeObjectURL(url)}
function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;const restored=d.state||d;if(!restored||typeof restored!=='object'||!restored.checks)throw 0;state={...restored,checks:restored.checks||{},habits:restored.habits||{}};if(d.schedule&&typeof d.schedule==='object'){Object.keys(schedule).forEach(k=>{if(d.schedule[k]&&Array.isArray(d.schedule[k].tasks))schedule[k]=d.schedule[k]});persistSchedule()}save();render();alert('Резервная копия загружена: отметки, чек-листы и расписание.')}catch(e){alert('Не удалось прочитать этот файл.')}};r.readAsText(f)};input.click()}
